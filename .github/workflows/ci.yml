name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealership
          POSTGRES_PASSWORD: dealership_dev_password
          POSTGRES_DB: dealership_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: dotnet build backend/Dealership.sln --configuration Release
      - run: dotnet test backend/Dealership.sln --configuration Release --no-build
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=dealership_dev;Username=dealership;Password=dealership_dev_password
      - run: npm --prefix frontend ci
      - name: Verify generated OpenAPI types
        run: |
          dotnet run --project backend/src/Dealership.Api --no-build --urls http://127.0.0.1:5080 > /tmp/dealership-api.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:5080/swagger/v1/swagger.json > frontend/openapi.json && break; sleep 1; done
          test -s frontend/openapi.json
          npm --prefix frontend run generate:api-types
          git diff --exit-code -- frontend/openapi.json frontend/app/api-types.ts
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=dealership_dev;Username=dealership;Password=dealership_dev_password
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
